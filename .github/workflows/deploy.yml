# Unified build & deploy — the whole publishing pipeline lives here (DESIGN.md §7).
#
# Two repos, ONE static artifact, ONE Cloudflare Pages project:
#   juno-site  → everything, incl. the garden at /garden (native Next.js static export)
#   juno-vault → the content (private; never deployed as-is)
#
# The garden used to be a separate Quartz build merged in; it is now rendered natively by the
# Next site (scripts/garden-extract.mjs in prebuild), so there's one build and one design system.
name: Deploy

on:
  push:
    branches: [main]
  # juno-vault can't run this workflow directly (it lives here), so it pings it instead — see
  # juno-vault/.github/workflows/dispatch.yml.
  repository_dispatch:
    types: [vault-updated, garden-updated]
  workflow_dispatch:

# A push to the vault and a push to the site can land seconds apart; deploying them out of
# order would publish stale content. Never cancel in-progress: a half-finished deploy is
# worse than a slightly delayed one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout juno-site
        uses: actions/checkout@v4
        with:
          path: juno-site

      # The vault is PRIVATE — the default GITHUB_TOKEN is scoped to this repo only, so a
      # PAT with read access is required. This checkout is the only place vault content
      # touches the runner; the extract steps below decide what may leave it.
      - name: Checkout juno-vault (private)
        uses: actions/checkout@v4
        with:
          repository: Juno-qwq/juno-vault
          token: ${{ secrets.VAULT_READ_TOKEN }}
          path: juno-vault

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install juno-site deps
        working-directory: juno-site
        run: npm ci

      # The prebuild hook runs extract-blog + roadmap-extract + garden-extract, all through
      # juno-vault/_system/scripts/vault-filter.mjs — the single privacy firewall (publish: true
      # only, _private/ hard-excluded, PDF/local links stripped). Schema violations fail the build.
      - name: Build site (Next.js static export, incl. /garden)
        working-directory: juno-site
        env:
          VAULT_PATH: ${{ github.workspace }}/juno-vault
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://juno.dev' }}
        run: npm run build

      # Last line of defence. If a private note ever reaches the artifact, fail here rather
      # than publish it — a failed deploy is recoverable, a leak is not.
      - name: Verify no private content in artifact
        run: |
          set -euo pipefail
          test -f juno-site/out/index.html
          test -f juno-site/out/garden/index.html
          if find juno-site/out -iname '*_private*' -o -ipath '*_private*' | grep -q .; then
            echo "::error::_private content present in the deploy artifact"; exit 1
          fi
          if grep -rIl -e 'libgen' -e '\.pdf' juno-site/out/garden juno-site/out/roadmap 2>/dev/null | grep -q .; then
            echo "::error::a PDF/libgen reference leaked into the garden or roadmap"; exit 1
          fi
          echo "Privacy check passed. Artifact: $(find juno-site/out -type f | wc -l) files"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy juno-site/out --project-name=juno --branch=main
